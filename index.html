<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Malesherbes — Ciel & Météo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-a:#e4e9ff;
    --bg-b:#d3dbf7;
    --bg-c:#c3cdef;
    --sun:#c9820f;
    --sun-dim:#a9803a;
    --moon:#5a63b0;
    --moon-dim:#6f78ab;
    --text:#1c2140;
    --text-dim:#5a6088;
    --line: rgba(28,33,64,0.10);
    --card: rgba(28,33,64,0.05);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0;
    background:transparent;
    height:100%;
    font-family:'Inter',system-ui,sans-serif;
  }
  .widget{
    width:100%;
    height:100%;
    min-height:115px;
    border-radius:18px;
    background:linear-gradient(120deg,var(--bg-a) 0%, var(--bg-b) 55%, var(--bg-c) 100%);
    color:var(--text);
    display:flex;
    flex-direction:column;
    justify-content:center;
    overflow:hidden;
    position:relative;
    box-shadow:0 1px 0 rgba(255,255,255,0.4) inset;
  }
  .arc{
    position:absolute;
    top:0; left:0; right:0;
    height:3px;
    background:linear-gradient(90deg, var(--sun) 0%, #d9b46a 30%, #6b6f9e 50%, var(--moon) 70%, var(--moon) 100%);
    opacity:0.9;
  }
  .search-row{
    padding:6px 14px 0;
    position:relative;
  }
  .search-box{
    display:flex;
    align-items:center;
    gap:6px;
    background:rgba(28,33,64,0.05);
    border:1px solid var(--line);
    border-radius:9px;
    padding:5px 9px;
  }
  .search-box svg{
    flex-shrink:0;
    opacity:0.55;
  }
  #communeInput{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:12px;
  }
  #communeInput::placeholder{
    color:var(--text-dim);
  }
  .suggestions{
    position:absolute;
    left:16px; right:16px;
    top:calc(100% - 2px);
    background:#f2f4fd;
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
    z-index:5;
    display:none;
  }
  .suggestions.open{display:block;}
  .suggestion{
    padding:8px 12px;
    font-size:13px;
    color:var(--text);
    cursor:pointer;
  }
  .suggestion:hover, .suggestion.active{
    background:rgba(28,33,64,0.06);
  }
  .suggestion .cp{
    color:var(--text-dim);
    font-size:11px;
    margin-left:6px;
  }
  .astro-row{
    display:flex;
    align-items:center;
    gap:18px;
    padding:8px 14px 6px;
  }
  .row{
    display:flex;
    align-items:center;
    gap:6px;
    white-space:nowrap;
  }
  .icon{
    font-size:14px;
    line-height:1;
    width:17px;
    text-align:center;
  }
  .times{
    display:flex;
    flex-direction:column;
    line-height:1.1;
  }
  .times .val{
    font-family:'Space Grotesk',sans-serif;
    font-size:13px;
    font-weight:600;
    letter-spacing:0.2px;
  }
  .times .val.sun{color:var(--sun);}
  .times .val.moon{color:var(--moon);}
  .sub{
    font-size:8.5px;
    color:var(--text-dim);
    letter-spacing:0.3px;
    text-transform:uppercase;
  }
  .moon-illum{
    font-family:'Space Grotesk',sans-serif;
    font-size:11px;
    color:var(--moon-dim);
    margin-left:3px;
  }
  .hline{
    height:1px;
    background:var(--line);
    margin:0 14px;
  }
  .forecast{
    padding:6px 12px 8px;
    overflow:hidden;
  }
  .fx-table{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
  }
  .fx-table td{
    text-align:center;
    padding:1.5px 2px;
    font-family:'Space Grotesk',sans-serif;
  }
  .fx-table .lbl{
    text-align:left;
    font-family:'Inter',sans-serif;
    font-size:8.5px;
    color:var(--text-dim);
    text-transform:uppercase;
    letter-spacing:0.2px;
    width:38px;
    padding-right:5px;
  }
  .fx-table .h{
    font-size:10px;
    font-weight:600;
    color:var(--text-dim);
  }
  .fx-table .t{
    font-size:13px;
    font-weight:700;
    color:var(--text);
  }
  .fx-table .v{
    font-size:10px;
    font-weight:500;
    color:var(--text-dim);
  }
  .fx-table .g{
    font-size:10px;
    font-weight:500;
    color:var(--moon-dim);
  }
  .fx-table .r{
    font-size:10px;
    font-weight:500;
    color:#7fb0e0;
  }
  .fx-table .now-col{
    background:rgba(245,185,66,0.13);
    border-radius:6px;
  }
  .status, .err{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    color:var(--text-dim);
    padding:0 12px;
  }
  .err{color:#e8998a;}
</style>
</head>
<body>

<div class="widget">
  <div class="arc"></div>

  <div class="search-row">
    <div class="search-box">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1c2140" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="text" id="communeInput" placeholder="Malesherbes" autocomplete="off">
    </div>
    <div class="suggestions" id="suggestions"></div>
  </div>

  <div class="astro-row">
    <div class="row">
      <span class="icon">☀️</span>
      <div class="times">
        <span class="val sun" id="sunTimes">--:-- / --:--</span>
        <span class="sub">Lever / Coucher</span>
      </div>
    </div>
    <div class="row">
      <span class="icon">🌙</span>
      <div class="times">
        <span class="val moon" id="moonTimes">--:-- / --:--<span class="moon-illum" id="moonIllum"></span></span>
        <span class="sub">Lever / Coucher</span>
      </div>
    </div>
  </div>

  <div class="hline"></div>

  <div class="forecast" id="forecast">
    <div class="status">Chargement AROME…</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/suncalc@1.9.0/suncalc.js"></script>
<script>
// Coordonnées par défaut : Malesherbes (45330)
let LAT = 48.2967;
let LON = 2.4058;
const TZ  = "Europe/Paris";

function fmtTime(date){
  if(!date || isNaN(date.getTime())) return "—";
  return date.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit', timeZone: TZ});
}

function refreshAll(){
  computeAstro();
  loadForecast();
}

// --- Autocomplétion commune (API officielle geo.api.gouv.fr) ---
const communeInput = document.getElementById('communeInput');
const suggestionsBox = document.getElementById('suggestions');
let searchTimer = null;
let activeIndex = -1;
let currentResults = [];

communeInput.addEventListener('input', () => {
  const q = communeInput.value.trim();
  clearTimeout(searchTimer);
  if(q.length < 2){
    suggestionsBox.classList.remove('open');
    return;
  }
  searchTimer = setTimeout(() => searchCommunes(q), 300);
});

communeInput.addEventListener('keydown', (e) => {
  if(!suggestionsBox.classList.contains('open')) return;
  if(e.key === 'ArrowDown'){
    e.preventDefault();
    activeIndex = Math.min(activeIndex + 1, currentResults.length - 1);
    renderSuggestions();
  }else if(e.key === 'ArrowUp'){
    e.preventDefault();
    activeIndex = Math.max(activeIndex - 1, 0);
    renderSuggestions();
  }else if(e.key === 'Enter'){
    e.preventDefault();
    if(currentResults[activeIndex]) selectCommune(currentResults[activeIndex]);
  }else if(e.key === 'Escape'){
    suggestionsBox.classList.remove('open');
  }
});

document.addEventListener('click', (e) => {
  if(!e.target.closest('.search-row')) suggestionsBox.classList.remove('open');
});

async function searchCommunes(query){
  try{
    const url = `https://geo.api.gouv.fr/communes?nom=${encodeURIComponent(query)}` +
      `&fields=nom,code,codesPostaux,centre&boost=population&limit=8`;
    const res = await fetch(url);
    if(!res.ok) throw new Error("API " + res.status);
    currentResults = await res.json();
    activeIndex = -1;
    renderSuggestions();
  }catch(e){
    suggestionsBox.innerHTML = `<div class="suggestion">Recherche indisponible</div>`;
    suggestionsBox.classList.add('open');
  }
}

function renderSuggestions(){
  if(currentResults.length === 0){
    suggestionsBox.classList.remove('open');
    return;
  }
  suggestionsBox.innerHTML = currentResults.map((c, i) => `
    <div class="suggestion${i===activeIndex?' active':''}" data-index="${i}">
      ${c.nom}<span class="cp">${(c.codesPostaux && c.codesPostaux[0]) || ''}</span>
    </div>
  `).join('');
  suggestionsBox.classList.add('open');
  suggestionsBox.querySelectorAll('.suggestion').forEach(el => {
    el.addEventListener('click', () => {
      const c = currentResults[parseInt(el.dataset.index, 10)];
      selectCommune(c);
    });
  });
}

function selectCommune(c){
  if(c.centre && c.centre.coordinates){
    LON = c.centre.coordinates[0];
    LAT = c.centre.coordinates[1];
  }
  communeInput.value = c.nom;
  suggestionsBox.classList.remove('open');
  refreshAll();
}

function computeAstro(){
  const now = new Date();
  const sunTimes = SunCalc.getTimes(now, LAT, LON);
  const moonTimes = SunCalc.getMoonTimes(now, LAT, LON, true);
  const moonIllum = SunCalc.getMoonIllumination(now);

  document.getElementById('sunTimes').textContent =
    `${fmtTime(sunTimes.sunrise)} / ${fmtTime(sunTimes.sunset)}`;

  let moonRise = moonTimes.rise ? fmtTime(moonTimes.rise) : (moonTimes.alwaysUp ? "toujours" : "—");
  let moonSet  = moonTimes.set  ? fmtTime(moonTimes.set)  : (moonTimes.alwaysDown ? "jamais" : "—");
  document.getElementById('moonTimes').innerHTML =
    `${moonRise} / ${moonSet}<span class="moon-illum">${Math.round(moonIllum.fraction*100)}%</span>`;

  return { sunset: sunTimes.sunset };
}

async function loadForecast(){
  const el = document.getElementById('forecast');
  try{
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}` +
      `&hourly=temperature_2m,wind_speed_10m,wind_gusts_10m,precipitation&models=arome_france` +
      `&timezone=${encodeURIComponent(TZ)}&forecast_days=2`;
    const res = await fetch(url);
    if(!res.ok) throw new Error("API " + res.status);
    const data = await res.json();

    const times = data.hourly.time.map(t => new Date(t));
    const temps = data.hourly.temperature_2m;
    const winds = data.hourly.wind_speed_10m;
    const gusts = data.hourly.wind_gusts_10m;
    const rains = data.hourly.precipitation;

    const start = new Date();
    start.setHours(19,0,0,0); // 19h aujourd'hui
    const end = new Date();
    end.setDate(end.getDate() + 1);
    end.setHours(2,0,0,0); // 2h du matin le lendemain

    const now = new Date();
    const cols = [];
    for(let i=0;i<times.length;i++){
      const t = times[i];
      if(t < start || t > end) continue;
      cols.push({
        t,
        temp: Math.round(temps[i]),
        wind: Math.round(winds[i]),
        gust: Math.round(gusts[i]),
        rain: rains[i],
        isNow: t.getHours()===now.getHours() && t.toDateString()===now.toDateString()
      });
    }

    if(cols.length === 0){
      el.innerHTML = '<div class="status">Aucune donnée sur la plage horaire</div>';
      return;
    }

    const hCells = cols.map(c => {
      const hh = c.t.toLocaleTimeString('fr-FR', {hour:'2-digit', timeZone: TZ}).replace(':00','h').replace(' ','');
      return `<td class="h${c.isNow?' now-col':''}">${hh}</td>`;
    }).join('');
    const tCells = cols.map(c => `<td class="t${c.isNow?' now-col':''}">${c.temp}°</td>`).join('');
    const vCells = cols.map(c => `<td class="v${c.isNow?' now-col':''}">${c.wind}</td>`).join('');
    const gCells = cols.map(c => `<td class="g${c.isNow?' now-col':''}">${c.gust}</td>`).join('');
    const rCells = cols.map(c => {
      const val = c.rain >= 0.1 ? c.rain.toFixed(1) : '–';
      return `<td class="r${c.isNow?' now-col':''}">${val}</td>`;
    }).join('');

    el.innerHTML = `
      <table class="fx-table">
        <tr><td class="lbl">Heure</td>${hCells}</tr>
        <tr><td class="lbl">Temp.</td>${tCells}</tr>
        <tr><td class="lbl">Vent</td>${vCells}</tr>
        <tr><td class="lbl">Rafales</td>${gCells}</tr>
        <tr><td class="lbl">Pluie</td>${rCells}</tr>
      </table>
    `;
  }catch(e){
    el.innerHTML = `<div class="err">Erreur météo : ${e.message}</div>`;
  }
}

refreshAll();

// Rafraîchit toutes les 15 minutes
setInterval(refreshAll, 15*60*1000);
</script>

</body>
</html>
